# Secret-scanning guardrail — layer 3 (CI, the layer nobody can skip).
#
# Two independent jobs:
#   detect-secrets   the working tree, against the committed .secrets.baseline (same engine
#                    as the local hooks, so CI and the developer agree)
#   gitleaks-history the FULL git history with the upstream rule set: catches what was
#                    committed before the guardrail existed or pushed with --no-verify
name: secrets

on:
  push:            # every branch: a feature branch left unmerged is scanned too, not only main
  pull_request:
  workflow_call:

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Baseline present
        run: |
          set -euo pipefail
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline is missing. Create it with toolkit/secrets/install-repo.sh"
            exit 1
          fi

      - name: detect-secrets over every tracked file
        # detect-secrets-hook exit codes: 0 clean, 1 a NEW finding not already in the
        # baseline (real block — the baseline is the audited list of accepted findings;
        # adding to it is a reviewed commit, not a flag), 3 the baseline only needed its
        # recorded line numbers refreshed and nothing new was found (bookkeeping only, see
        # secrets/README.md "False positives and bookkeeping"). `xargs` would otherwise remap
        # every non-zero exit (1 and 3 alike) to 123, so the batching and the exit-code
        # handling are done here instead, exactly like the local pre-commit/pre-push hooks:
        # each batch runs against a throwaway COPY of the baseline (never the committed
        # file), and status 3 is treated as a pass.
        run: |
          set -euo pipefail
          tmp_baseline="$(mktemp)"
          cp .secrets.baseline "$tmp_baseline"
          trap 'rm -f "$tmp_baseline"' EXIT

          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(git ls-files -z)

          status=0
          batch_size=200
          for ((i = 0; i < ${#files[@]}; i += batch_size)); do
            chunk=("${files[@]:i:batch_size}")
            [ ${#chunk[@]} -gt 0 ] || continue
            rc=0
            uvx --from 'detect-secrets==1.5.0' detect-secrets-hook --baseline "$tmp_baseline" \
              -- "${chunk[@]}" || rc=$?
            case "$rc" in
              0) ;;
              3)
                echo "detect-secrets-hook exit 3 on a temporary baseline copy: line-number bookkeeping only, no new secret — treated as pass."
                ;;
              1)
                echo "::error::detect-secrets-hook found a new secret not already in .secrets.baseline (see output above)"
                status=1
                ;;
              *)
                echo "::error::detect-secrets-hook exited $rc while scanning ${#chunk[@]} file(s) — treated as a block"
                status=1
                ;;
            esac
          done
          exit "$status"

      - name: Baseline audit status
        # Informational: unaudited entries are accepted findings nobody has looked at yet.
        run: |
          set -euo pipefail
          uv run --no-project --quiet python - <<'PY'
          import json, pathlib
          baseline = json.loads(pathlib.Path(".secrets.baseline").read_text(encoding="utf-8"))
          results = baseline.get("results", {})
          total = sum(len(v) for v in results.values())
          unaudited = [
              f"{name}:{item['line_number']} {item['type']}"
              for name, items in sorted(results.items())
              for item in items
              if "is_secret" not in item
          ]
          print(f"baseline: {total} accepted finding(s), {len(unaudited)} not audited yet")
          for line in unaudited:
              print(f"::warning::unaudited baseline entry: {line}")
          PY

  uv-lock-index:
    # Fails when uv.lock points at anything but the public PyPI index (a registry
    # other than https://pypi.org/simple, or a wheel/sdist host other than
    # files.pythonhosted.org). Same script the pre-commit hook runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      - name: uv.lock index is PyPI
        run: uv run --no-project --quiet python .github/scripts/check-uv-lock-index.py

  gitleaks-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans commits, not the working tree

      - name: gitleaks over the full history
        run: |
          set -euo pipefail
          # Pinned by tag; digest at the time of pinning:
          # sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          image="zricethezav/gitleaks:v8.30.1"
          docker pull -q "$image"

          # GIT_CONFIG_*: the container runs as a different uid than the checkout owner; git
          # refuses to read a repository it does not own without this.
          rc=0
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$image" git /repo --no-banner --redact --verbose --exit-code 1 \
            >gitleaks.log 2>&1 || rc=$?
          cat gitleaks.log

          # gitleaks exits 0 on an empty directory ("0 commits scanned", no leaks found), so a
          # broken mount would look like a pass. Refuse that answer.
          commits="$(git rev-list --count HEAD)"
          if [ "$commits" -gt 0 ] && grep -Eq '(^|[^0-9])0 commits scanned' gitleaks.log; then
            echo "::error::gitleaks scanned 0 of the $commits commits: the checkout never reached the container"
            exit 1
          fi
          exit "$rc"
