name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make lint
      # Catalogue first: it is instant and says whether a scenario lost a suite.
      - run: make scenarios
      - run: make test
      - run: docker build -t mcp-frankfurter:ci .

  mutation:
    # Its own job: mutmut re-runs the test suite hundreds of times.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: make mutation
